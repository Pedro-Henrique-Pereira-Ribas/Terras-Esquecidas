# Blueprint do Render para a API de contas e saves do Terra Perdida.
# No Render: New + Blueprint, conecte este repositório e confirme os recursos.
#
# O banco é criado como Postgres gerenciado pelo Render e a API recebe
# automaticamente a DATABASE_URL interna. O schema é aplicado no boot.
services:
  - type: web
    name: terra-perdida-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        fromDatabase:
          name: terra-perdida-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: CORS_ORIGIN
        value: "https://pedro-henrique-pereira-ribas.github.io,http://localhost:4173,http://127.0.0.1:4173"
      - key: AUTO_MIGRATE
        value: "true"
      - key: SESSION_DAYS
        value: "30"
      - key: BCRYPT_ROUNDS
        value: "12"

databases:
  - name: terra-perdida-db
    plan: free
    databaseName: terra_perdida
    user: terra
