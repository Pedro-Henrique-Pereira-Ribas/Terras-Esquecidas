# Blueprint do Render para o Terra Perdida.
# No Render: New + Blueprint, conecte este repositório e confirme os recursos.
#
# Dois recursos:
# - a API, um Web Service Node que também serve a pasta front/
# - o site, um Static Site que publica a pasta _site/ (mesmo conteúdo)
#
# O banco é um Postgres gerenciado no Neon (plano gratuito): cole a
# DATABASE_URL em Dashboard > Environment do Web Service.
services:
  - type: web
    name: terras-esquecidas-back
    runtime: node
    plan: free
    # A raiz do repositório é usada de propósito: o Web Service também serve
    # a pasta front/ (o site fica disponível na URL da API, como redundância).
    rootDir: .
    buildCommand: npm --prefix back ci && npm --prefix back run build
    startCommand: npm --prefix back start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      # Connection string do Postgres no Neon. Cole a URL em Dashboard > Env Vars
      # (ou use sync: false para o Render não sobrescrever). Exemplo:
      # postgresql://USER:PASSWORD@HOST/neondb?sslmode=verify-full
      - key: DATABASE_URL
        sync: false
      # O Neon exige TLS na conexão.
      - key: DATABASE_SSL
        value: "true"
      # O site é um Static Site em outra origem, então a API precisa liberar a
      # origem dele (e as locais, para desenvolvimento).
      - key: CORS_ORIGIN
        value: "https://terras-esquecidas.onrender.com,http://localhost:4173,http://127.0.0.1:4173"
      - key: AUTO_MIGRATE
        value: "true"
      - key: SESSION_DAYS
        value: "30"
      - key: BCRYPT_ROUNDS
        value: "12"
      # Serve a pasta front/ na mesma porta da API.
      - key: SERVE_FRONT
        value: "true"
      # O Render coloca um proxy na frente do app.
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: "info"
      # Dono do Reino: e o unico e-mail que aprova pedidos e libera contas.
      - key: OWNER_EMAIL
        value: "p.ribas2301@gmail.com"
      # Provedor transacional de e-mail (Resend). Sem a chave, o pedido
      # continua na fila do painel, mas nenhum e-mail sai.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Terra Perdida <nao-responda@terras-esquecidas.com>"

  - type: web
    name: terras-esquecidas
    runtime: static
    rootDir: .
    # npm run build copia a pasta front/ para _site/ (scripts/build-static.mjs),
    # sem nenhuma dependência. O Static Site publica o resultado.
    buildCommand: npm run build
    staticPublishPath: ./_site
    autoDeployTrigger: commit
    routes:
      # O painel de administracao responde em /admin, sem .html.
      - type: rewrite
        source: /admin
        destination: /admin.html
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
