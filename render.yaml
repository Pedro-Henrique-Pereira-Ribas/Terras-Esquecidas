# Blueprint do Render para o Terra Perdida.
# No Render: New + Blueprint, conecte este repositório e confirme os recursos.
#
# Site e API são publicados no mesmo Web Service: o backend Express serve a
# pasta front/ na mesma porta, então o jogo e a API ficam na mesma origem
# (sem CORS e sem latência entre domínios).
#
# O banco é criado como Postgres gerenciado pelo Render e a API recebe
# automaticamente a DATABASE_URL interna. O schema é aplicado no boot.
services:
  - type: web
    name: terra-perdida-api
    runtime: node
    plan: free
    # A raiz do repositório é usada de propósito: o Web Service precisa da
    # pasta front/ em runtime para servir o site. Com rootDir: back, o front/
    # não chegaria ao servidor.
    rootDir: .
    buildCommand: npm --prefix back ci && npm --prefix back run build
    startCommand: npm --prefix back start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        fromDatabase:
          name: terra-perdida-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      # O site é um Static Site em outra origem, então a API precisa liberar
      # a origem dele (e as locais, para desenvolvimento).
      - key: CORS_ORIGIN
        value: "https://terras-esquecidas.onrender.com,http://localhost:4173,http://127.0.0.1:4173"
      - key: AUTO_MIGRATE
        value: "true"
      - key: SESSION_DAYS
        value: "30"
      - key: BCRYPT_ROUNDS
        value: "12"
      # Serve a pasta front/ na mesma porta da API.
      - key: SERVE_FRONT
        value: "true"
      # O Render coloca um proxy na frente do app.
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: "info"

databases:
  - name: terra-perdida-db
    plan: free
    databaseName: terra_perdida
    user: terra
